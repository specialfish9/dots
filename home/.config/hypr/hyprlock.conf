general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = false
    immediate_render = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = false
    }
}

background {
    path = ~/Pictures/wallpaper.l.png
}

label {
    text = $TIME
    text_align = center
    color = rgba(255, 255, 255, 1)
    font_size = 250
    font_family = Google Sans Code NF
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 10
    rounding = 25
    dots_size = 0.0
    dots_spacing = 0.30
    dots_center = true
    
    inner_color = rgba(255, 255, 255, 0.4)
    outer_color = rgba(255, 255, 255, 0)
    check_color = rgba(142, 142, 142, 0.9)
    fail_color = rgba(100, 0, 0, 1)
    capslock_color = rgba(255, 100, 77, 0.3)
    font_color = rgba(255, 255, 255, 1)
    
    font_family = Google Sans Code NF
    font_size = 25
    placeholder_text = Secret
    fail_text = Nope, <b>attempt: $ATTEMPTS</b>
    fail_timeout = 1000
    
    fade_on_empty = false
    hide_input = false
    swap_font_color = false
    valign = center
    halign = center
    position = 0%, -20%
}
