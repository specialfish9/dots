# All keys: https://github.com/xkbcommon/libxkbcommon/blob/master/include/xkbcommon/xkbcommon-keysyms.h

monitor=eDP-1,preferred,1920x0,1
monitor=DP-2,preferred,1920x0,1

input {
    kb_layout =it

    follow_mouse=1
    natural_scroll=yes

    touchpad {
        natural_scroll=yes
    }

}

general {
    gaps_in=0
    gaps_out=0
    border_size=2
    col.active_border=0xCC88FFFF
    col.inactive_border=0x000000 #0x66333333
}

decoration {
    rounding=0

    blur {
      enabled=true
      size=1 # minimum 1
      passes=1 # minimum 1, more passes = more resource intensive.
      # Your blur "amount" is blur_size * blur_passes, but high blur_size (over around 5-ish) will produce artifacts.
      # if you want heavy blur, you need to up the blur_passes.
      # the more passes, the more you can up the blur_size without noticing artifacts.
      new_optimizations=true
    }
}

# animations {
#     enabled=1
#     animation=windows,1,1,default
#     animation=border,1,3,default
#     animation=fade,1,3,default
#     animation=workspaces,1,2,default,slidevert
# }

animations {
    enabled = true
    # Curves
    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = expressiveDefaultSpatial, 0.38, 1.21, 0.22, 1.00
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standardDecel, 0, 0, 0, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    # Configs
    # windows
    animation = windowsIn, 1, 3, emphasizedDecel, popin 80%
    animation = windowsOut, 1, 2, emphasizedDecel, popin 90%
    animation = windowsMove, 1, 3, emphasizedDecel, slide
    animation = border, 1, 10, emphasizedDecel
    # layers
    animation = layersIn, 1, 2.7, emphasizedDecel, popin 93%
    animation = layersOut, 1, 2.4, menu_accel, popin 94%
    # fade
    animation = fadeLayersIn, 1, 0.5, menu_decel
    animation = fadeLayersOut, 1, 2.7, menu_accel
    # workspaces
    animation = workspaces, 1, 7, menu_decel, slide
    ## specialWorkspace
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
}


dwindle {
    pseudotile=1 # enable pseudotiling on dwindle
    force_split=0 # 0 means the split direction follows mouse position relative to the window
    preserve_split=1
}

gesture = 3, vertical, workspace

misc {
  disable_hyprland_logo=true
}

windowrule=pin, class:eww
windowrule=opacity 0.95, class:.*foot.*

bind=SUPER,RETURN,exec,footclient
bind=SUPER,space,exec, wofi # -o DP-3
bind=SUPER,w,killactive,
bind=SUPERSHIFT,M,exit, 
bind=SUPERSHIFT,RETURN,exec,nautilus 
bind=SUPER,escape,exec,sh $HOME/.config/wofi/powermenu.sh
bind=SUPERSHIFT,f,togglefloating,

bind=SUPER,S,togglesplit

bind=SUPERSHIFT,u,exec,hyprctl keyword input:kb_layout us
bind=SUPERSHIFT,i,exec,hyprctl keyword input:kb_layout it

bind=SUPER,h,movefocus,l
bind=SUPER,l,movefocus,r
bind=SUPER,k,movefocus,u
bind=SUPER,j,movefocus,d
bind=SUPERSHIFT,h,movewindow,l
bind=SUPERSHIFT,l,movewindow,r
bind=SUPERSHIFT,k,movewindow,u
bind=SUPERSHIFT,j,movewindow,d

bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9
bind=SUPER,0,workspace,10

bind=SUPERSHIFT,1,movetoworkspace,1
bind=SUPERSHIFT,2,movetoworkspace,2
bind=SUPERSHIFT,3,movetoworkspace,3
bind=SUPERSHIFT,4,movetoworkspace,4
bind=SUPERSHIFT,5,movetoworkspace,5
bind=SUPERSHIFT,6,movetoworkspace,6
bind=SUPERSHIFT,7,movetoworkspace,7
bind=SUPERSHIFT,8,movetoworkspace,8
bind=SUPERSHIFT,9,movetoworkspace,9
bind=SUPERSHIFT,0,movetoworkspace,10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind=,Print,exec,/home/mattia/.local/bin/scr
bind=,Prior,exec,/home/mattia/.local/bin/nothing
bind=,Next,exec,/home/mattia/.local/bin/nothing

bind=SUPER,mouse_down,workspace,e+1
bind=SUPER,mouse_up,workspace,e-1

bind=SUPER,F,fullscreen
bind =SUPER,P,pseudo, # dwindle

# Brightness
bind=,XF86MonBrightnessUp,exec,brightnessctl set 5%+
bind=,XF86MonBrightnessDown,exec,brightnessctl set 3%-

# Speaker volume
bind=,XF86AudioRaiseVolume,exec,amixer set Master 10%+
bind=,XF86AudioLowerVolume,exec,amixer set Master 10%-
bind=,XF86AudioMute,exec,amixer set Master 0%

# Mic volume
bind=SUPER,XF86AudioRaiseVolume,exec,pamixer --default-source -i 5
bind=SUPER,XF86AudioLowerVolume,exec,pamixer --default-source -d 5
bind=,XF86AudioMicMute,exec,pamixer --default-source --toggle-mute

# Media keys
bindl = , XF86NotificationCenter, exec, playerctl play-pause
bindl = , XF86PickupPhone, exec, playerctl previous
bindl = , XF86HangupPhone, exec, playerctl next


# Screenshot
bind=,XF86SelectiveScreenshot,exec,XDG_CURRENT_DESKTOP=sway scr

# allow for screen recording via xdg-desktop-portal-wlr
exec-once=XDG_CURRENT_DESKTOP=sway dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=XDG_CURRENT_DESKTOP=sway systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK
exec-once=XDG_CURRENT_DESKTOP=sway hash dbus-update-activation-environment 2>/dev/null && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP

exec-once = gnome-keyring-daemon --start --components=secrets

# background
exec-once=swaybg -i /home/mattia/Pictures/wallpaper.h2.png -m fit

# notification daemon
exec-once=dunst

# status bar
exec-once=waybar

# eww
#exec-once=/home/mattia/.config/eww/launch_bar

# disk automount
exec-once=udiskie -an --no-tray -f nautilus	# udiskie and udisks2 must be installed. Change nautilus with whatever you like

# startup applications
exec-once=foot --server
